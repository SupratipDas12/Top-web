<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Link Download & History</title>

<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial;
    padding:20px;
}
.container{
    max-width:600px;
    margin:auto;
}
input{
    width:100%;
    padding:10px;
    border-radius:6px;
    border:none;
    margin-bottom:10px;
}
button{
    padding:10px;
    width:100%;
    border:none;
    border-radius:6px;
    background:#28a745;
    color:#fff;
    cursor:pointer;
}
video{
    width:100%;
    margin-top:10px;
    border-radius:10px;
}
.history{
    margin-top:20px;
}
.item{
    background:#222;
    padding:8px;
    border-radius:6px;
    margin-bottom:6px;
    cursor:pointer;
}
.item:hover{background:#333;}
small{color:#aaa;}
</style>
</head>

<body>

<div class="container">

<h2>🔗 Paste Video Link</h2>

<input type="text" id="videoURL" placeholder="Paste direct video link (.mp4)">
<button onclick="downloadVideo()">Download & Play</button>

<video id="player" controls></video>

<div class="history">
    <h3>📜 Video History (Local)</h3>
    <div id="list"></div>
</div>

</div>

<script>
const player = document.getElementById("player");
const list = document.getElementById("list");

let history = JSON.parse(localStorage.getItem("video_links")) || [];
render();

function downloadVideo(){
    const url = document.getElementById("videoURL").value.trim();
    if(!url) return alert("Paste video link");

    fetch(url)
    .then(res => res.blob())
    .then(blob => {
        const videoBlobURL = URL.createObjectURL(blob);
        player.src = videoBlobURL;
        player.play();

        const data = {
            url: videoBlobURL,
            original: url,
            time: new Date().toLocaleString()
        };

        history.unshift(data);
        localStorage.setItem("video_links", JSON.stringify(history));
        render();
    })
    .catch(()=>{
        alert("❌ Video download failed (CORS blocked or invalid link)");
    });
}

function render(){
    list.innerHTML = "";
    history.forEach(v=>{
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            ▶ ${v.original}<br>
            <small>${v.time}</small>
        `;
        div.onclick = ()=>{
            player.src = v.url;
            player.play();
        };
        list.appendChild(div);
    });
}
</script>

</body>
</html>
