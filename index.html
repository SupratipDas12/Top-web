<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Local Storage History</title>

<style>
body{
    background:#0f0f0f;
    color:#fff;
    font-family:Arial;
    padding:20px;
}
.container{
    max-width:600px;
    margin:auto;
}
video{
    width:100%;
    margin-top:10px;
    border-radius:10px;
}
.history{
    margin-top:20px;
}
.item{
    background:#1f1f1f;
    padding:8px;
    margin-bottom:6px;
    border-radius:6px;
    cursor:pointer;
}
.item:hover{
    background:#333;
}
small{
    color:#aaa;
}
.clear{
    background:#ff3b3b;
    border:none;
    color:#fff;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>📹 Video Player (Local Storage)</h2>

    <input type="file" id="videoInput" accept="video/*">

    <video id="player" controls></video>

    <div class="history">
        <h3>📜 Watch History</h3>
        <div id="list"></div>
        <button class="clear" onclick="clearHistory()">Clear History</button>
    </div>
</div>

<script>
const input = document.getElementById("videoInput");
const player = document.getElementById("player");
const list = document.getElementById("list");

let history = JSON.parse(localStorage.getItem("video_history")) || [];

// Load saved history
render();

input.addEventListener("change", () => {
    const file = input.files[0];
    if(!file) return;

    const videoURL = URL.createObjectURL(file);
    player.src = videoURL;
    player.play();

    const data = {
        name: file.name,
        time: new Date().toLocaleString(),
        url: videoURL
    };

    history.unshift(data);
    localStorage.setItem("video_history", JSON.stringify(history));
    render();
});

function render(){
    list.innerHTML = "";
    history.forEach((v, i) => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            ▶ ${v.name}<br>
            <small>${v.time}</small>
        `;
        div.onclick = () => {
            player.src = v.url;
            player.play();
        };
        list.appendChild(div);
    });
}

function clearHistory(){
    if(confirm("Delete local history?")){
        localStorage.removeItem("video_history");
        history = [];
        render();
    }
}
</script>

</body>
</html>
