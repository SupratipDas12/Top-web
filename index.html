<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Any Video Downloader</title>

<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial;
    padding:20px;
}
.container{
    max-width:600px;
    margin:auto;
}
input,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:6px;
    border:none;
}
button{
    background:#28a745;
    color:#fff;
    cursor:pointer;
}
video{
    width:100%;
    margin-top:15px;
    border-radius:10px;
}
.history{
    margin-top:20px;
}
.item{
    background:#222;
    padding:8px;
    margin-bottom:6px;
    border-radius:6px;
    cursor:pointer;
}
.item:hover{background:#333;}
small{color:#aaa;}
</style>
</head>

<body>

<div class="container">
<h2>🔗 Paste Any Video Link</h2>

<input type="text" id="url" placeholder="Paste YouTube / Insta / Any link">
<button onclick="download()">Download & Play</button>

<video id="player" controls></video>

<div class="history">
    <h3>📜 History (Local)</h3>
    <div id="list"></div>
</div>
</div>

<script>
const player = document.getElementById("player");
const list = document.getElementById("list");

let history = JSON.parse(localStorage.getItem("video_history")) || [];
render();

function download(){
    const url = document.getElementById("url").value.trim();
    if(!url) return alert("Paste link");

    fetch("download.php",{
        method:"POST",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({url:url})
    })
    .then(res=>res.json())
    .then(d=>{
        if(d.error) return alert(d.error);

        player.src = d.video;
        player.play();

        history.unshift({
            link:url,
            file:d.video,
            time:new Date().toLocaleString()
        });
        localStorage.setItem("video_history", JSON.stringify(history));
        render();
    });
}

function render(){
    list.innerHTML="";
    history.forEach(v=>{
        const div=document.createElement("div");
        div.className="item";
        div.innerHTML=`▶ ${v.link}<br><small>${v.time}</small>`;
        div.onclick=()=>{
            player.src=v.file;
            player.play();
        };
        list.appendChild(div);
    });
}
</script>

</body>
</html>
