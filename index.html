<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Upload & History</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:#fff;
    padding:20px;
}
.container{
    max-width:600px;
    margin:auto;
}
video{
    width:100%;
    border-radius:10px;
    background:#000;
}
input{
    margin:10px 0;
}
.history{
    margin-top:20px;
}
.history h3{
    margin-bottom:10px;
}
.history-item{
    padding:8px;
    background:#222;
    margin-bottom:6px;
    border-radius:6px;
    cursor:pointer;
}
.history-item:hover{
    background:#333;
}
.clear{
    background:red;
    border:none;
    padding:6px 10px;
    color:#fff;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>📹 Video Upload with History</h2>

<input type="file" id="videoInput" accept="video/*">

<video id="videoPlayer" controls></video>

<div class="history">
    <h3>📜 Video History</h3>
    <div id="historyList"></div>
    <button class="clear" onclick="clearHistory()">Clear History</button>
</div>

</div>

<script>
const videoInput = document.getElementById("videoInput");
const videoPlayer = document.getElementById("videoPlayer");
const historyList = document.getElementById("historyList");

let videoHistory = JSON.parse(localStorage.getItem("videoHistory")) || [];

// Load history on page load
renderHistory();

videoInput.addEventListener("change", function(){
    const file = this.files[0];
    if(!file) return;

    const url = URL.createObjectURL(file);
    videoPlayer.src = url;
    videoPlayer.play();

    const videoData = {
        name: file.name,
        url: url,
        time: new Date().toLocaleString()
    };

    videoHistory.unshift(videoData);
    localStorage.setItem("videoHistory", JSON.stringify(videoHistory));
    renderHistory();
});

function renderHistory(){
    historyList.innerHTML = "";
    videoHistory.forEach((video, index) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `▶ ${video.name}<br><small>${video.time}</small>`;
        div.onclick = () => {
            videoPlayer.src = video.url;
            videoPlayer.play();
        };
        historyList.appendChild(div);
    });
}

function clearHistory(){
    if(confirm("Clear video history?")){
        localStorage.removeItem("videoHistory");
        videoHistory = [];
        renderHistory();
    }
}
</script>

</body>
</html>
